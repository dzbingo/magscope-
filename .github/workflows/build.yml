name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If the project was uploaded as a single zip file, unpack it first.
      - name: Unpack project zip (if present)
        run: |
          if [ -f magscope.zip ]; then
            unzip -q -o magscope.zip
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/pubspec.yaml
          flutter create --platforms=android --org dev.magscope --project-name magscope .
          # make sure our own sources win over anything the template wrote
          rm -rf lib
          cp -r /tmp/backup/lib lib
          cp /tmp/backup/pubspec.yaml pubspec.yaml

      - name: Apply Bluetooth-ready manifest
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      # Some plugins (camera, Bluetooth, location) need a newer minimum Android
      # version than Flutter's default. Android 8.0+ covers nearly all phones.
      - name: Raise minSdk to 26
        run: |
          f=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          echo "Patching $f"
          sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 26/' "$f"
          grep -n 'minSdk' "$f"

      # Newer Flutter requires every plugin to compile against Android 36, but some
      # plugins (e.g. file_picker 8) still declare 34. Force 36 for all of them.
      - name: Force compileSdk 36 for plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            f=android/build.gradle.kts
            printf '%s\n' \
              'subprojects {' \
              '    afterEvaluate {' \
              '        extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) }' \
              '    }' \
              '}' > /tmp/patch.gradle
          else
            f=android/build.gradle
            printf '%s\n' \
              'subprojects {' \
              '    afterEvaluate { p ->' \
              '        if (p.hasProperty("android")) { p.android { compileSdkVersion 36 } }' \
              '    }' \
              '}' > /tmp/patch.gradle
          fi
          echo "Patching $f"
          cat /tmp/patch.gradle "$f" > /tmp/merged.gradle
          cp /tmp/merged.gradle "$f"
          head -12 "$f"

      - name: Localised app name (MagVision Pro / MagVision Pro)
        run: |
          cp -r android_overrides/res/. android/app/src/main/res/
          sed -i 's/android:label="MagVision Pro"/android:label="@string\/app_name"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Dark launch screen
        run: |
          for d in drawable drawable-v21; do
            mkdir -p android/app/src/main/res/$d
            cp android_overrides/launch_background.xml android/app/src/main/res/$d/launch_background.xml
          done

      - name: Download font (optional)
        continue-on-error: true
        run: |
          mkdir -p assets/fonts
          for w in Regular Medium SemiBold Bold; do
            curl -fsSL -o assets/fonts/IBMPlexSansArabic-$w.ttf \
              https://github.com/google/fonts/raw/main/ofl/ibmplexsansarabic/IBMPlexSansArabic-$w.ttf || true
          done
          python3 tool/add_fonts.py

      - name: Get packages
        run: flutter pub get

      # Gradle is normally downloaded from GitHub releases, which sometimes answers
      # 504. Download it ourselves with many retries (two mirrors) and point the
      # wrapper to the local file.
      - name: Pre-download Gradle (with retries)
        run: |
          props=android/gradle/wrapper/gradle-wrapper.properties
          ver=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*' "$props" | head -1 | sed 's/gradle-//')
          echo "Gradle version: $ver"
          ok=0
          for round in 1 2 3; do
            for url in \
              "https://services.gradle.org/distributions/gradle-$ver-bin.zip" \
              "https://downloads.gradle.org/distributions/gradle-$ver-bin.zip"; do
              echo "Downloading $url (round $round)"
              if curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o "/tmp/gradle-$ver-bin.zip" "$url"; then
                ok=1; break 2
              fi
            done
            sleep 30
          done
          if [ "$ok" = 1 ]; then
            sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\:///tmp/gradle-$ver-bin.zip#" "$props"
            echo "Using local Gradle"
          else
            echo "Could not pre-download Gradle; using the default wrapper download"
          fi
          cat "$props"

      - name: Generate launcher icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 tool/make_icon.py
          dart run flutter_launcher_icons

      # A fixed signing key + a rising version number, so each new APK installs
      # over the previous one as an update (no need to uninstall).
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp android_overrides/debug.keystore ~/.android/debug.keystore

      - name: Build release APK
        run: |
          set +e
          # Retry when GitHub/Gradle downloads fail with a temporary server error.
          for attempt in 1 2 3; do
            flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then break; fi
            if grep -q -E 'HTTP response code: 5|Read timed out|Connection reset|Could not GET|Could not HEAD' build.log; then
              echo "Temporary network error, retrying ($attempt/3)..."
              sleep 20
            else
              break
            fi
          done
          if [ "$code" -ne 0 ]; then
            {
              echo '## Build errors (copy this text)'
              echo '```'
              grep -n -E -A8 'What went wrong|Execution failed|Manifest merger|Could not resolve|Because |error:|Error:|^e: |FAILURE' build.log | head -150
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: magscope-apk
          path: build/app/outputs/flutter-apk/app-release.apk
